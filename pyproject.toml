[project]
name = "micro-agent"
version = "2.0.0"
description = "面向垂域应用的轻量级 AI Agent 框架"
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.50.0",
    "loguru>=0.7.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "python-dotenv>=1.0.0",
    "mcp>=1.4.0",
    "httpx>=0.27.0",
    "aiofiles>=24.0.0",
    "jinja2>=3.1.0",
    "numpy>=1.26.0",
    "python-multipart>=0.0.9",
    "PyPDF2>=3.0.0",
    "python-docx>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["micro_agent*", "api*", "tasks*"]
