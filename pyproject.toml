[project]
name = "fdu-micro-agent"
version = "2.0.0"
description = "A lightweight AI Agent framework for vertical domain applications"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    {name = "FDU EB Lab"},
]
keywords = ["agent", "llm", "ai", "react", "rag", "mcp", "vertical-domain"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "litellm>=1.50.0",
    "loguru>=0.7.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.0",
    "numpy>=1.26.0",
    "aiofiles>=24.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "python-multipart>=0.0.9",
]
mcp = ["mcp>=1.4.0", "pymysql>=1.1.0"]
rag = ["PyPDF2>=3.0.0", "python-docx>=1.0.0"]
all = ["fdu-micro-agent[api,mcp,rag]"]
dev = [
    "fdu-micro-agent[all]",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
]

[project.urls]
Homepage = "https://github.com/fdueblab/Micro-Agent"
Repository = "https://github.com/fdueblab/Micro-Agent"
Issues = "https://github.com/fdueblab/Micro-Agent/issues"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["micro_agent*"]
