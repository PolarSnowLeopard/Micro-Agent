version: "3"

services:
  micro_agent:
    build: .
    container_name: micro_agent
    ports:
      - "8010:8010"
      - "8000:8000"
      - "2222:22"
    volumes:
      - ./workspace/data:/app/workspace/data
      - ./micro_agent:/app/micro_agent
      - ./api:/app/api
      - ./tasks:/app/tasks
      - ./workspace/skills:/app/workspace/skills
      - ./workspace/knowledge:/app/workspace/knowledge
    command: ["uvicorn", "api.app:app", "--host", "0.0.0.0", "--port", "8010", "--reload", "--reload-dir", "/app/api", "--reload-dir", "/app/tasks", "--reload-dir", "/app/micro_agent"]
    env_file:
      - .env
    stdin_open: true
    tty: true
    restart: unless-stopped
